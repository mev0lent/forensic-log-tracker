[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forensic-log-tracker"
version = "1.0.1"
description = "CLI tool for documenting, hashing, and signing forensic investigations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
  {name = "Niklas Heringer", email = "ping@niklas-heringer.com"}
]
keywords = ["forensics", "dfir", "cli", "digital-forensics", "chain-of-custody"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security",
]
dependencies = [
  "click>=8.1.8",
  "colorama>=0.4.6",
  "python-dotenv>=1.1.0",
  "Jinja2>=3.1.6",
  "MarkupSafe>=3.0.2",
  "markdown-it-py>=3.0.0",
  "mdurl>=0.1.2",
  "PyYAML>=6.0.2",
  "rich>=14.0.0",
  "shellingham>=1.5.4",
  "typer>=0.15.2",
  "typing_extensions>=4.13.2",
  "tzdata>=2025.2",
  "Pygments>=2.19.1",
  "path>=17.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "pytest-cov>=5.0.0",
]

[project.scripts]
flt = "forensic_log_tracker.cli:main"

[project.urls]
Homepage = "https://github.com/mev0lent/forensic-log-tracker"

[tool.setuptools.packages.find]
include = ["forensic_log_tracker*", "core*", "utils*"]
exclude = ["flt_env*", "logs*", "useful_scripts*", "Planning*", "test*"]

[tool.setuptools.package-data]
forensic_log_tracker = ["config/*.yaml", "templates/*.j2"]